name: Feature Request
description: Suggest a new feature or improvement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature. Use the form below to share your idea.
  - type: textarea
    id: feature_description
    attributes:
      label: Feature description
      description: What would you like to see and why?
      placeholder: |
        Example: I would like the cutting board to support automation via hoppers. Right now it is frustrating when a recipe does not work with automation.
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other details or screenshots here.
      placeholder: |
        Example: This would improve compatibility with modpacks that focus on automation and tech.
